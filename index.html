<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra Notebook Worksheets</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--ink:#1d4fd8;--green:#6aa820;--rule:#cfe3f3;--lav:#b9a3e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#d9d3c3;font-family:'Patrick Hand','Comic Sans MS',cursive;color:#444;font-size:20px}
.page{position:relative;max-width:780px;margin:12px auto;padding:20px 18px 40px 74px;background:#fffef7 repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:4px;max-width:calc(100% - 16px)}
@media(min-width:800px){.page{max-width:780px}}
.page:before{content:"";position:absolute;left:54px;top:0;bottom:0;border-left:2px solid #f0a0a0}
h1{margin:0;font-size:32px;font-weight:400;line-height:32px}
.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;min-height:64px}
.top input{font:inherit;border:0;border-bottom:2px dotted #888;background:transparent;width:170px;color:var(--ink)}
.score{background:#fff6a8;padding:2px 12px;transform:rotate(-2deg);box-shadow:1px 1px 4px rgba(0,0,0,.2)}
.how{margin:0 0 32px;line-height:32px}
.q{margin:0 0 32px}
h2{margin:32px 0 0;font-size:26px;font-weight:400;line-height:32px;text-decoration:underline wavy var(--green);text-underline-offset:6px}
.q p{margin:0;line-height:32px}
.ladder{margin:16px 0 0;padding:0;width:max-content;max-width:100%;overflow-x:auto}
.r{display:flex}
.r input,.r span{height:48px;width:72px;border:0;border-bottom:2px solid #d9cbf3;background:transparent;text-align:center;font:600 30px 'Caveat',cursive;color:var(--ink);min-width:0;padding:0;line-height:48px;display:block}
.r input:focus{outline:2px solid #ffb400;outline-offset:-2px;background:#fff9d6}
.r .p{width:56px;color:var(--green);border-right:2px solid var(--lav)}
.r span{color:#555;font-family:'Patrick Hand',cursive;font-weight:400;font-size:26px}
.r span.p{color:var(--green)}
.ctl{margin:8px 0 12px;display:flex;gap:8px}
button{font:inherit;font-size:18px;border:2px solid #555;background:#fff;border-radius:8px;padding:2px 12px;cursor:pointer;color:#333}
button:hover{background:#fff3b0}
button.go{background:#6aa820;color:#fff;border-color:#4d7f14}
.ans{line-height:48px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ans input{font:600 28px 'Caveat',cursive;color:var(--ink);border:0;border-bottom:2px solid #555;background:transparent;width:150px;text-align:center}
.ans input.w{width:90px}
.fb{margin:6px 0 0;font-weight:700;min-height:32px}
.fb.ok{color:#2f8a1f}.fb.no{color:#c0392b}
.sol{margin-top:8px;padding:6px 12px 10px;border:2px dashed var(--green);border-radius:8px;background:#f7ffe9;display:none}
.sol.show{display:block}
.sol .g{color:var(--green);font-size:24px;line-height:36px}
.sol .tag{line-height:32px}
.done.ok{background:#e4f5d6}
#pdfmsg{font-size:16px}

button{transition:transform .15s,background .2s,box-shadow .2s}
button:hover{transform:translateY(-2px);box-shadow:0 3px 6px rgba(0,0,0,.18)}
button:active{transform:scale(.96)}
button.big{font-size:24px;padding:6px 26px}
.endrow{text-align:center;margin-top:32px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.r{animation:rowin .35s ease both}
.score{animation:float 4s ease-in-out infinite alternate}
.score.pop{animation:pop .5s ease,float 4s ease-in-out .5s infinite alternate}
.sol.show{animation:drop .5s ease}
.fb.ok{animation:bounce .6s ease}
.fb.no{animation:shake .4s ease}
h1{animation:rowin .8s ease both}
@keyframes rowin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes float{from{transform:rotate(-2deg) translateY(0)}to{transform:rotate(-1deg) translateY(-3px)}}
@keyframes pop{0%{transform:rotate(-2deg) scale(1)}40%{transform:rotate(2deg) scale(1.25)}100%{transform:rotate(-2deg) scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes card{from{opacity:0;transform:scale(.8) rotate(-2deg)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(40,35,25,.55);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:10}
.ov.show{display:flex;animation:fade .3s}
.card{background:#fffef7;border:3px solid #6aa820;border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:100%;overflow:auto;text-align:center;animation:card .45s cubic-bezier(.2,1.4,.4,1)}
.card h3{margin:0;font-weight:400;font-size:30px}
.card .big{font:600 64px 'Caveat',cursive;color:var(--ink);line-height:1.1}
.lrow{display:flex;justify-content:space-between;border-bottom:2px dotted #bbb;padding:2px 4px}
.card .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.ln{display:flex;align-items:center}
.ln span{width:34px;text-align:center;font:600 28px 'Caveat',cursive;color:#555}
.ln input{flex:1;min-width:0;height:40px;border:0;background:transparent;font:600 28px 'Caveat',cursive;color:var(--ink);padding:0}
.ln input:focus{outline:2px solid #ffb400;background:#fff9d6}
.ans{margin-top:6px}.ans input{width:210px}
.tg{font-size:15px;padding:0 9px;border-radius:10px;background:#e4f5d6;color:#2f6a12;margin-right:4px}.tg.w{background:#e6e0ff;color:#4b3aa8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.tc{text-align:left;background:#fff;border:2px solid var(--lav);border-radius:14px;padding:14px;font-size:20px;line-height:28px;animation:rowin .6s ease both}
.tc:hover{background:#f6f0ff}.tc .em{font-size:34px;display:block}
.bub{display:none;position:relative;margin:16px 0 4px 20px;padding:10px 16px;background:#fff3b0;border:2px solid #e0b400;border-radius:18px;line-height:28px}
.bub.show{display:block;animation:bubin .55s cubic-bezier(.2,1.4,.4,1)}
.bub:before{content:"";position:absolute;left:26px;top:-14px;border:12px solid transparent;border-top:0;border-bottom:14px solid #e0b400}
.bub p{margin:4px 0}.bub u{text-decoration:none;font-weight:700;color:#8a6500}
.bub .sl{font:600 26px 'Caveat',cursive;color:var(--ink);padding-left:14px;line-height:30px}
@keyframes bubin{from{opacity:0;transform:scale(.7) translateY(-12px)}to{opacity:1;transform:none}}
</style>

 if(q.ty=='i'){var t=v.replace(/\s/g,'').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/−/g,'-'),m=t.match(/^([a-z])(<=|>=|<|>)(-?[\d.]+)$/),n=t.match(/^(-?[\d.]+)(<=|>=|<|>)([a-z])$/),F={'<':'>','>':'<','<=':'>=','>=':'<='},s,o,k;
